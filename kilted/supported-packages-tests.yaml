# test_package specs; applied only when the package is also listed in supported-packages.yaml
# Entries follow the same order as supported-packages.yaml.
test-packages:
  ament_package:
    type: python
    script: |
      from ament_package.templates import get_environment_hook_template_path

      print("hello from ament_package test_package")
      print(get_environment_hook_template_path("hello"))

  ament_cpplint:
    type: run
    command: ament_cpplint --help

  ament_flake8:
    type: run
    command: ament_flake8 --help

  ament_lint_cmake:
    type: run
    command: ament_lint_cmake --help

  ament_lint_common:
    type: run
    commands:
      - ament_copyright --help
      - ament_cppcheck --help
      - ament_cpplint --help
      #- ament_flake8 --help  # FIXME: flake8 python packages are not supported yet
      - ament_xmllint --help
      - ament_uncrustify --help

  ament_xmllint:
    type: run
    command: ament_xmllint --help

  ament_cmake:
    type: cmake
    cmake: |
      cmake_minimum_required(VERSION 3.8)
      project(ament_cmake_test_package)

      find_package(ament_cmake REQUIRED)
      find_package(ament_cmake_gen_version_h REQUIRED)

      add_executable(main main.cpp)

      ament_generate_version_header(main)
      ament_index_register_resource("special_demo_resource")

      install(TARGETS main
        DESTINATION lib/${PROJECT_NAME})
      ament_package()
    files:
      package.xml: |
        <?xml version="1.0"?>
        <?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?>
        <package format="2">
          <name>ament_cmake_test_package</name>
          <version>2.1.0</version>
          <description>Test package for ament_cmake</description>
          <maintainer email="fake@email.com">Fake Maintainer</maintainer>
          <license>MIT</license>

          <export>
            <build_type>ament_cmake</build_type>
          </export>
        </package>
      main.cpp: |
        #include <iostream>
        // This header is created by the ament_generate_version_header macro
        #include "ament_cmake_test_package/version.h" 

        int main() {
            std::cout << "--- Ament CMake Macro Test ---" << std::endl;
            
            // These constants are defined inside the generated version.h
            std::cout << "Project Name: " << "ament_cmake_test_package" << std::endl;
            std::cout << "Version: "      << AMENT_CMAKE_TEST_PACKAGE_VERSION_STR << std::endl;
            std::cout << "Major: "        << AMENT_CMAKE_TEST_PACKAGE_VERSION_MAJOR << std::endl;
            
            return 0;
        }

  ament_cmake_core:
    type: cmake
    cmake: |
      cmake_minimum_required(VERSION 3.15)
      project(ament_cmake_core_test_package CXX)

      find_package(ament_cmake_core CONFIG REQUIRED)

      ament_package()

    files:
      package.xml: |
        <?xml version="1.0"?>
        <?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?>
        <package format="2">
          <name>ament_cmake_core_test_package</name>
          <version>0.1.0</version>
          <description>Test package for ament_cmake_core</description>
          <maintainer email="fake@email.com">Fake Maintainer</maintainer>
          <license>MIT</license>

          <export>
            <build_type>ament_cmake</build_type>
          </export>
        </package>
